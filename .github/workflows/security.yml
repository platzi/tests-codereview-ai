name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  semgrep:
    name: semgrep (src/payments_svc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run semgrep
        id: run_semgrep
        # No requiere login/API key: usa rulesets publicos del registry.
        # continue-on-error para poder generar el reporte aunque haya
        # hallazgos ERROR; el gate real esta en el step de abajo.
        continue-on-error: true
        run: |
          semgrep \
            --config p/security-audit \
            --config p/python \
            --config p/owasp-top-ten \
            src/payments_svc \
            --json --output semgrep-results.json

      - name: Generar reporte de seguridad.md
        if: always()
        id: report
        # continue-on-error: el script sale con codigo 1 si hay hallazgos
        # ERROR; queremos que igual se publique el reporte como artifact
        # antes de fallar el job en el ultimo step.
        continue-on-error: true
        run: python scripts/generate_security_report.py semgrep-results.json "reporte de seguridad.md"

      - name: Publicar reporte como artifact descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-seguridad
          path: |
            reporte de seguridad.md
            semgrep-results.json

      - name: Fallar el job si hay hallazgos ERROR
        if: steps.report.outcome == 'failure'
        run: exit 1
